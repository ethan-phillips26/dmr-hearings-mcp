[project]
name = "dmr-hearings-mcp"
version = "0.1.0"
description = "MCP server for searching North Dakota oil and gas hearing transcripts and dockets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "mcp[cli]>=2.2.0",
    "numpy",
    "pypdf",
    "sqlite-vec>=0.1.9",
    "yt-dlp",
]

[project.scripts]
dmr-mcp = "dmr_hearings.server:main"
dmr-update = "dmr_hearings.pipeline.update:main"
dmr-search = "dmr_hearings.search:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmr_hearings"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long docstrings and regexes; the formatter handles code
